name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0.exe'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest $url -OutFile $setup
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Compiler checksum mismatch' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'inno'
          $p = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/PORTABLE=1','/NOICONS',('/DIR="' + $compilerDir + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Compiler preparation failed' }
          "ISCC_PATH=$compilerDir\ISCC.exe" >> $env:GITHUB_ENV
      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -Iscc $env:ISCC_PATH
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application versions differ' }
      - uses: actions/upload-artifact@v4
        with:
          name: SubClick-win-x64
          path: artifacts/installer/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SubClick-win-x64
          path: installer
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" installer/* --draft --prerelease --title "SubClick $RELEASE_TAG" --generate-notes
